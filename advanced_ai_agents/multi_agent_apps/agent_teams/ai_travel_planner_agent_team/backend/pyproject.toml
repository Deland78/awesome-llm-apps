[project]
name = "agno-hackathon"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.12"
dependencies = [
    "agno>=1.5.6",
    "asyncpg>=0.30.0",
    "boto3>=1.38.27",
    "cuid2>=2.0.1",
    "exa-py>=1.13.1",
    "fast-flights>=2.2",
    "fastapi>=0.115.12",
    "firecrawl-py>=2.7.1",
    "google-genai>=1.18.0",
    "loguru>=0.7.3",
    "mem0ai>=0.1.102",
    "pydantic>=2.11.5",
    "python-dotenv>=1.1.0",
    "sqlalchemy>=2.0.41",
    "uvicorn>=0.34.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.4",
    "pytest-asyncio>=0.25.2",
    "pytest-cov>=6.0.0",
    "httpx>=0.28.1",
    "pytest-mock>=3.14.0",
]

[tool.setuptools]
py-modules = []

[tool.setuptools.packages.find]
where = ["."]
include = ["api*", "agents*", "config*", "models*", "router*", "services*", "repository*", "tools*"]
